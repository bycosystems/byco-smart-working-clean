<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ByCo Smart Working</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      background:#081120;
      color:white;
      font-family:Arial, sans-serif;
    }

    .hero{
      min-height:100vh;
      display:flex;
      flex-direction:column;
      justify-content:center;
      padding:60px;
      max-width:1200px;
      margin:auto;
    }

    .badge{
      display:inline-block;
      padding:10px 18px;
      border:1px solid rgba(0,255,255,0.3);
      border-radius:999px;
      color:#67e8f9;
      background:rgba(0,255,255,0.08);
      margin-bottom:30px;
      width:fit-content;
    }

    h1{
      font-size:72px;
      line-height:1.05;
      max-width:900px;
    }

    p{
      margin-top:30px;
      font-size:22px;
      color:#94a3b8;
      max-width:700px;
      line-height:1.7;
    }

    .buttons{
      display:flex;
      gap:20px;
      margin-top:45px;
      flex-wrap:wrap;
    }

    .btn-primary{
      background:#22d3ee;
      color:black;
      padding:18px 30px;
      border-radius:18px;
      text-decoration:none;
      font-weight:bold;
    }

    .btn-secondary{
      border:1px solid rgba(255,255,255,0.2);
      color:white;
      padding:18px 30px;
      border-radius:18px;
      text-decoration:none;
    }

    @media(max-width:768px){

      .hero{
        padding:30px;
      }

      h1{
        font-size:42px;
      }

      p{
        font-size:18px;
      }

    }
  </style>
</head>

<body>

  <section class="hero">

    <div class="badge">
      BYCO SYSTEMS
    </div>

    <h1>
      Intelligent client intake systems for modern businesses
    </h1>

    <p>
      Capture leads, qualify requests and guide visitors automatically with a premium AI-powered experience available 24/7.
    </p>

    <div class="buttons">

      <a href="#" class="btn-primary">
        Request a Demo
      </a>

      <a href="#" class="btn-secondary">
        Watch Demo
      </a>

    </div>

  </section>

</body>
</html>
